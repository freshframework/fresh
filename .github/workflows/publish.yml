name: Publish JSR

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    # Skip publishing for forks
    if: github.repository_owner == 'denoland'

    steps:
      - uses: actions/checkout@v7

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          cache: true
          deno-version: canary

      - name: Install dependencies
        run: deno install

      - name: Publish
        run: deno publish

name: CI

on:
  push:
    branches: [next]
  pull_request:

# The three jobs have no `needs:` between them, so they run in parallel.
jobs:
  check:
    name: Check (format, lint, typecheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm run fmt:check
      - name: Run linter
        run: pnpm run lint
      - name: Build
        # Builds the example + fixture apps, which generates their `.fresh/`
        # tsconfig + route typings that the typechecker depends on.
        run: pnpm run build
      - name: Run typechecker
        run: pnpm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm test

  # https://playwright.dev/docs/ci-intro#setting-up-github-actions
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start Playwright runner container
        uses: dtinth/setup-playwright-test-docker@main
      - name: Run end-to-end tests
        run: pnpm run test:e2e
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  publish:
    name: Publish unreleased package versions
    if: github.event_name == 'push' && github.ref == 'refs/heads/next'
    needs: [check, unit, e2e]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Publish unreleased versions
        run: pnpm -r stage publish --provenance --publish-branch next --access public
